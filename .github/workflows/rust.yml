name: Rust

on:
  push:
    paths: &paths
      - "rust/**"
      - "src/**"
      - "include/**"
      - "gen_*.py"
      - "bvnr_data.py"
      - ".github/workflows/rust.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-tests:
    # The C library the binding wraps, tested by its own unchanged suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBVNR_BUILD_TESTS=ON .
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --parallel 4

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      WASI_SDK_VERSION: "34"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Install wasi-sdk
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"
      - run: cargo build --target wasm32-wasip2
